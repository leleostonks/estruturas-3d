<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Acervo de Estruturas</title>
<meta http-equiv="content-language" content="pt-BR">
<meta name="google" content="notranslate">
<script>document.documentElement.lang = 'pt-BR';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: biblioteca em grade com filtro lateral; ficha do modelo com palco 3D + painel técnico */
:root{
  --bg:#eceff1; --surface:#f8f9fa; --sunk:#e2e6e9; --stage:#dde2e6;
  --ink:#1a2127; --muted:#586570; --line:#c9d0d6; --grid:#b7c0c7;
  --accent:#e2a200; --accent-ink:#1a2127; --node:#1a2127;
  --m1:#2d5c89; --m2:#c98500; --m3:#62717e; --m4:#34876a; --m5:#a44848; --m6:#6f57a3;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171b; --surface:#1b2126; --sunk:#232a30; --stage:#0f1316;
  --ink:#e5e9ec; --muted:#93a0aa; --line:#2d363d; --grid:#2c353c;
  --accent:#f2b632; --accent-ink:#13171b; --node:#e5e9ec;
  --m1:#6ea2d6; --m2:#f2b632; --m3:#a7b3bc; --m4:#5dbd92; --m5:#e07b7b; --m6:#a88bdb;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171b; --surface:#1b2126; --sunk:#232a30; --stage:#0f1316;
  --ink:#e5e9ec; --muted:#93a0aa; --line:#2d363d; --grid:#2c353c;
  --accent:#f2b632; --accent-ink:#13171b; --node:#e5e9ec;
  --m1:#6ea2d6; --m2:#f2b632; --m3:#a7b3bc; --m4:#5dbd92; --m5:#e07b7b; --m6:#a88bdb;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{font:700 22px/1 var(--display);letter-spacing:.01em;display:block}
.brand small{font:12px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em}
.search{flex:1 1 260px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 12px}
.search input{border:0;background:none;padding:9px 0;width:100%;outline:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}

/* biblioteca */
.lib{display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:start}
.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
.cats h4,.panel h3{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.cat-btn{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:14px}
.cat-btn:hover{background:var(--sunk)}
.cat-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cat-btn span:last-child{font-family:var(--mono);font-size:12px;opacity:.7}
.cats hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.lib-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:16px}
.lib-head h1{font:600 30px/1.1 var(--display);margin:0;text-wrap:balance}
.lib-head p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--muted);transform:translateY(-2px)}
.card-open{display:flex;flex-direction:column;text-align:left;border:0;background:none;padding:0;cursor:pointer;flex:1}
.card-dl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 12px}
.card-dl span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.card-dl button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:3px 9px;font:500 12px var(--mono);cursor:pointer}
.card-dl button.skp{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.card-dl button:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.thumb{aspect-ratio:16/11;max-width:100%;background:var(--stage);display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font:12px var(--mono);color:var(--muted)}
.thumb .star{position:absolute;top:8px;right:8px;font-size:15px;color:var(--accent)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.card-body .cat{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-body h3{font:600 18px/1.2 var(--display);margin:0}
.card-body .meta{font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* ficha */
.det{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.stage-wrap{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:clamp(360px,68vh,760px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.views{position:absolute;top:10px;left:10px;display:flex;gap:4px;flex-wrap:wrap}
.views button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px 4px 8px;font-size:12px;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dims{position:absolute;top:12px;right:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 8px}
.hint{position:absolute;right:12px;bottom:12px;font:11px var(--mono);color:var(--muted)}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.phead{display:flex;gap:12px;align-items:flex-start}
.phead > div{flex:1;min-width:0}
.phead .cat{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phead h2{font:700 28px/1.1 var(--display);margin:4px 0 8px;text-wrap:balance}
.phead p{margin:0;color:var(--muted);font-size:14px}
.fav{border:1px solid var(--line);background:none;border-radius:6px;width:38px;height:38px;cursor:pointer;font-size:18px;color:var(--muted);flex:none}
.fav[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.params{display:flex;flex-direction:column;gap:12px}
.prm label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.prm output{font-family:var(--mono);font-size:13px}
.prm input[type=range]{width:100%;accent-color:var(--accent)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head h3{margin:0}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .el{display:flex;align-items:center;gap:6px;font-weight:500;text-transform:capitalize}
td select{width:100%;max-width:180px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:3px;font-size:12px}
tfoot td{font-weight:600;border-bottom:0}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.totals div{background:var(--sunk);border-radius:6px;padding:8px 10px}
.totals span{display:block;font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.totals b{font:600 18px/1.3 var(--mono)}
.exp{display:flex;flex-wrap:wrap;gap:8px}
.exp-out{margin-top:10px}
.exp-out textarea{width:100%;height:130px;font:11px/1.4 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px;resize:vertical}
.exp-out p{font-size:12px;color:var(--muted);margin:4px 0 0}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:10}

@media (max-width:900px){
  .det{grid-template-columns:1fr}
  .stage-wrap{position:relative;top:0;height:clamp(320px,58vh,520px)}
}
@media (max-width:720px){
  .lib{grid-template-columns:1fr}
  .cats{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  .cats h4,.cats hr{display:none}
  .cat-btn{border:1px solid var(--line);padding:5px 10px}
  .lib-head h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="home" aria-label="Voltar à biblioteca">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 27 L17 5 L31 27 Z M3 27 H31 M10 16 L17 27 L24 16 M17 5 V27" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/></svg>
      <span><b>Acervo de Estruturas</b><small>modelos 3D paramétricos</small></span>
    </button>
    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--muted)" stroke-width="1.6"/><path d="M11 11l4 4" stroke="var(--muted)" stroke-width="1.6"/></svg><input id="q" type="search" placeholder="Buscar treliça, galpão, torre…" aria-label="Buscar modelos"></label>
    <label class="btn primary" for="up">Enviar modelo (STL/OBJ)</label>
    <input id="up" type="file" accept=".stl,.obj" hidden multiple>
  </header>

  <main id="lib-view" class="lib">
    <nav class="cats" id="cats" aria-label="Categorias"></nav>
    <div>
      <div class="lib-head"><h1 id="lib-title">Todos os modelos</h1><p id="lib-count"></p></div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <main id="det-view" hidden>
    <div class="crumb"><button class="btn" id="back">← Biblioteca</button><span id="crumb-cat"></span></div>
    <div class="det">
      <div class="stage-wrap">
        <canvas id="stage" aria-label="Visualização 3D do modelo"></canvas>
        <div class="views" id="views">
          <button data-v="iso" aria-pressed="true">Isométrica</button>
          <button data-v="front" aria-pressed="false">Frente</button>
          <button data-v="top" aria-pressed="false">Topo</button>
          <button data-v="side" aria-pressed="false">Lateral</button>
          <button data-v="spin" aria-pressed="false">Girar</button>
        </div>
        <div class="dims mono" id="dims"></div>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="panel">
        <section class="phead">
          <div><span class="cat" id="d-cat"></span><h2 id="d-name"></h2><p id="d-desc"></p></div>
          <button class="fav" id="fav" aria-pressed="false" aria-label="Salvar modelo">★</button>
        </section>
        <section id="sec-params">
          <div class="sec-head"><h3>Parâmetros</h3><button class="linkbtn" id="reset">Restaurar padrão</button></div>
          <div class="params" id="params"></div>
        </section>
        <section id="sec-bom">
          <div class="sec-head"><h3>Lista de materiais</h3></div>
          <div class="tbl"><table><thead><tr><th>Elemento</th><th>Perfil</th><th class="n">Qtde.</th><th class="n">Compr. (m)</th><th class="n">Peso (kg)</th></tr></thead><tbody id="bom"></tbody><tfoot id="bom-foot"></tfoot></table></div>
          <div class="totals" id="totals"></div>
          <p class="note">Pesos nominais (aço, kg/m de catálogo). Sem ligações, chapas e parafusos. Estimativa para orçamento, não substitui o dimensionamento.</p>
        </section>
        <section id="sec-imp" hidden>
          <h3>Modelo importado</h3>
          <p class="note" id="imp-info"></p>
        </section>
        <section id="sec-exp">
          <div class="sec-head"><h3>Exportar</h3></div>
          <div class="exp">
            <button class="btn primary" data-exp="dae">Baixar para SketchUp</button>
            <button class="btn" data-exp="obj">Copiar OBJ</button>
            <button class="btn" data-exp="dxf">Copiar DXF</button>
            <button class="btn" data-exp="csv">Copiar CSV</button>
          </div>
          <div class="exp-out" id="exp-out" hidden>
            <textarea id="exp-text" readonly aria-label="Conteúdo exportado"></textarea>
            <p id="exp-hint"></p>
          </div>
        </section>
      </aside>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const m = (a, b, t) => ({ a, b, t });
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (v, d = 1) => v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- perfis (kg/m nominal) ---------- */
const PERFIS = [
  { id: 'L50', nome: 'Cantoneira L 50×5', kg: 3.77, d: .05 },
  { id: 'L76', nome: 'Cantoneira L 76×6,3', kg: 7.29, d: .076 },
  { id: 'TQ50', nome: 'Tubo quadrado 50×50×3', kg: 4.43, d: .05 },
  { id: 'TQ100', nome: 'Tubo quadrado 100×100×4', kg: 11.7, d: .1 },
  { id: 'TC60', nome: 'Tubo redondo Ø60,3×3,6', kg: 5.03, d: .06 },
  { id: 'U150', nome: 'U 152×12,2', kg: 12.2, d: .152 },
  { id: 'W150', nome: 'W 150×13', kg: 13.0, d: .15 },
  { id: 'W200', nome: 'W 200×22,5', kg: 22.5, d: .2 },
  { id: 'W250', nome: 'W 250×32,7', kg: 32.7, d: .25 },
  { id: 'W310', nome: 'W 310×38,7', kg: 38.7, d: .31 },
  { id: 'W360', nome: 'W 360×51', kg: 51.0, d: .355 },
];
const PF = Object.fromEntries(PERFIS.map(p => [p.id, p]));

/* ---------- geradores ---------- */
function trussPlane(L, H, n, kind, z, out) {
  const dx = L / n, x0 = -L / 2;
  const B = i => [x0 + i * dx, 0, z], T = i => [x0 + i * dx, H, z];
  if (kind === 'warren') {
    const Tm = i => [x0 + (i + .5) * dx, H, z];
    for (let i = 0; i < n; i++) {
      out.push(m(B(i), B(i + 1), 'banzo inferior'), m(B(i), Tm(i), 'diagonal'), m(Tm(i), B(i + 1), 'diagonal'));
      if (i < n - 1) out.push(m(Tm(i), Tm(i + 1), 'banzo superior'));
    }
    return out;
  }
  for (let i = 0; i < n; i++) out.push(m(B(i), B(i + 1), 'banzo inferior'), m(T(i), T(i + 1), 'banzo superior'));
  for (let i = 0; i <= n; i++) out.push(m(B(i), T(i), 'montante'));
  if (kind === 'vierendeel') return out;
  for (let i = 0; i < n; i++) {
    const left = (i + .5) < n / 2;
    if (kind === 'pratt') out.push(left ? m(T(i), B(i + 1), 'diagonal') : m(B(i), T(i + 1), 'diagonal'));
    else out.push(left ? m(B(i), T(i + 1), 'diagonal') : m(T(i), B(i + 1), 'diagonal'));
  }
  return out;
}
const P = (k, label, min, max, step, v, u = 'm') => ({ k, label, min, max, step, v, u });
const TRUSS_T = ['banzo superior', 'banzo inferior', 'montante', 'diagonal'];
const TRUSS_PROF = { 'banzo superior': 'L76', 'banzo inferior': 'L76', 'montante': 'L50', 'diagonal': 'L50' };

const MODELS = [
  { id: 'pratt', name: 'Treliça Pratt', cat: 'Treliças planas', tags: 'viga treliçada banzo paralelo',
    desc: 'Banzos paralelos com diagonais tracionadas descendo para o centro. Boa para vãos médios com carga gravitacional.',
    params: [P('L', 'Vão', 4, 40, .5, 12), P('H', 'Altura', .4, 5, .1, 1.5), P('n', 'Painéis', 2, 24, 1, 8, '')],
    types: TRUSS_T, prof: TRUSS_PROF, build: p => trussPlane(p.L, p.H, p.n, 'pratt', 0, []) },
  { id: 'howe', name: 'Treliça Howe', cat: 'Treliças planas', tags: 'viga treliçada madeira',
    desc: 'Diagonais comprimidas subindo para o centro e montantes tracionados. Clássica em madeira.',
    params: [P('L', 'Vão', 4, 40, .5, 12), P('H', 'Altura', .4, 5, .1, 1.5), P('n', 'Painéis', 2, 24, 1, 8, '')],
    types: TRUSS_T, prof: TRUSS_PROF, build: p => trussPlane(p.L, p.H, p.n, 'howe', 0, []) },
  { id: 'warren', name: 'Treliça Warren', cat: 'Treliças planas', tags: 'viga treliçada triangular',
    desc: 'Triângulos equiláteros alternados, sem montantes. Menos barras e esforços que alternam tração e compressão.',
    params: [P('L', 'Vão', 4, 40, .5, 14), P('H', 'Altura', .4, 5, .1, 1.4), P('n', 'Módulos', 2, 24, 1, 8, '')],
    types: ['banzo superior', 'banzo inferior', 'diagonal'], prof: TRUSS_PROF, build: p => trussPlane(p.L, p.H, p.n, 'warren', 0, []) },
  { id: 'vierendeel', name: 'Viga Vierendeel', cat: 'Treliças planas', tags: 'vierendeel quadro rígido aberturas',
    desc: 'Quadros rígidos sem diagonais. Libera passagem entre montantes; os nós trabalham à flexão.',
    params: [P('L', 'Vão', 4, 30, .5, 10), P('H', 'Altura', .6, 4, .1, 2), P('n', 'Painéis', 2, 16, 1, 5, '')],
    types: ['banzo superior', 'banzo inferior', 'montante'], prof: { 'banzo superior': 'TQ100', 'banzo inferior': 'TQ100', 'montante': 'TQ100' },
    build: p => trussPlane(p.L, p.H, p.n, 'vierendeel', 0, []) },
  { id: 'tesoura', name: 'Tesoura de duas águas', cat: 'Coberturas', tags: 'telhado tesoura cobertura fink',

}

  return [...map.values()];
}

    rmax = Math.max(rmax, r);

    const list = byType[t];

    const im = new THREE.InstancedMesh(CYL, mat, list.length);

}

  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());

/* ---------- miniaturas ---------- */
const tR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

function pump() {
  const id = thumbQueue.shift();
  if (!id) { thumbBusy = false; return; }
  thumbBusy = true;
  const md = byId(id);
  if (md) {
    const pm = defaults(md), mem = md.user ? [] : md.build(pm);
    const { group, box } = buildObject(md, mem, md.prof || {}, new Set());
    const sc = makeScene(); sc.add(group);
    tR.setClearColor(COL.stage); fit(tCam, box, 'iso'); tR.render(sc, tCam);
    thumbs[id] = tR.domElement.toDataURL('image/png');
    disposeGroup(group);
    const img = document.querySelector(`.card[data-id="${id}"] .thumb`);
    if (img) img.innerHTML = thumbHTML(id);
  }
  requestAnimationFrame(pump);
}

/* ---------- resumo / BOM ---------- */
function bom(md, mem, pmap) {
  const rows = md.types.map(t => ({ t, n: 0, len: 0 }));
  const idx = Object.fromEntries(rows.map((r, i) => [r.t, i]));
  for (const x of mem) { const r = rows[idx[x.t]]; r.n++; r.len += Math.hypot(x.b[0] - x.a[0], x.b[1] - x.a[1], x.b[2] - x.a[2]); }
  rows.forEach(r => r.kg = r.len * (PF[pmap[r.t]]?.kg || 0));
  return rows.filter(r => r.n);
}
for (const md of MODELS) {
  const pm = defaults(md), mem = md.build(pm), rows = bom(md, mem, md.prof);
  summary[md.id] = { bars: mem.length, kg: rows.reduce((s, r) => s + r.kg, 0) };
}

  const files = [...e.target.files]; e.target.value = '';
  const added = [];
  for (const f of files) {
    try {
      const ext = f.name.split('.').pop().toLowerCase(); let object;
      if (ext === 'stl') {
        const geo = new THREE.STLLoader().parse(await f.arrayBuffer()); geo.computeVertexNormals();
        object = new THREE.Mesh(geo);
      } else if (ext === 'obj') {
        object = new THREE.OBJLoader().parse(await f.text());
      } else continue;
      let tris = 0;
      object.traverse(o => { if (o.isMesh) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
      const md = { id: 'u' + (++upN), name: f.name.replace(/\.[^.]+$/, ''), cat: 'Meus modelos', user: true, object, tris, fmt: ext.toUpperCase(), desc: `Arquivo ${f.name} enviado por você.`, tags: 'importado', types: [] };
      userModels.push(md); added.push(md.id);
    } catch (err) { toast(`Não foi possível ler ${f.name}. Envie um STL ou OBJ válido.`); }
  }
  if (!added.length) return;
  queueThumbs(added);
  cat = 'Meus modelos'; query = ''; $('#q').value = '';
  if (added.length === 1) openModel(added[0]); else showLib();
  toast(`${added.length} ${added.length === 1 ? 'modelo adicionado' : 'modelos adicionados'} a Meus modelos`);
});

/* ---------- utilitários ---------- */
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

function retheme() {
  readColors();
  for (const k in thumbs) delete thumbs[k];
  renderGrid(); queueThumbs(allModels().map(x => x.id));
  if (cur && !$('#det-view').hidden) { renderLegend(); rebuild(false); }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

readColors();
renderGrid();
queueThumbs(MODELS.map(x => x.id));
})();
</script>
